
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where Is My Bus?</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* MAIN BACKGROUND IMAGE */
    body {
      background-image:
        linear-gradient(rgba(30, 0, 0, 0.45), rgba(30, 0, 0, 0.55)),
        url("images/home-bg.jpg"); /* INSERT YOUR BACKGROUND IMAGE HERE */

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #790d0d;
    }

    .home-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
    }

    /* HEADING */
    .heading {
      color: white;
      margin-bottom: 45px;
      text-shadow: 0 3px 15px rgba(0,0,0,0.5);
    }

    .heading h1 {
      font-size: clamp(30px, 5vw, 55px);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .heading p {
      font-size: clamp(13px, 2vw, 17px);
      margin-top: 12px;
      color: #fff0f0;
    }

    .heading-line {
      width: 75px;
      height: 4px;
      background: #ff4545;
      margin: 18px auto 0;
      border-radius: 10px;
    }

    /* PORTAL OPTIONS */
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      width: min(850px, 100%);
    }

    .portal-card {
      position: relative;
      height: 230px;
      overflow: hidden;
      border-radius: 17px;
      text-decoration: none;
      border: 2px solid rgba(255,255,255,0.65);
      background: #a71919;
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: flex-end;
    }

    /* PORTAL IMAGE */
    .portal-card img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      inset: 0;
      transition: transform 0.4s ease;
    }

    .portal-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(75, 0, 0, 0.95),
        rgba(130, 0, 0, 0.08) 80%
      );
    }

    .portal-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.4);
      border-color: white;
    }

    .portal-card:hover img {
      transform: scale(1.08);
    }

    .portal-card-content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 20px 12px;
      color: white;
    }

    .portal-card-content h2 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .portal-card-content p {
      font-size: 11px;
      color: #ffe5e5;
    }

    .portal-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background: white;
      color: #b51f1f;
      border-radius: 50%;
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .footer-text {
      position: absolute;
      bottom: 18px;
      color: rgba(255,255,255,0.8);
      font-size: 11px;
      text-shadow: 0 2px 5px black;
    }

    /* TABLET */
    @media (max-width: 700px) {
      .portal-grid {
        gap: 14px;
      }

      .portal-card {
        height: 190px;
      }

      .portal-card-content h2 {
        font-size: 16px;
      }

      .portal-card-content p {
        font-size: 10px;
      }
    }

    /* MOBILE */
    @media (max-width: 520px) {
      .home-container {
        padding: 18px;
      }

      .heading {
        margin-bottom: 30px;
      }

      .heading h1 {
        font-size: 31px;
      }

      .heading p {
        font-size: 12px;
      }

      .portal-grid {
        grid-template-columns: 1fr;
        gap: 12px;
        width: min(340px, 100%);
      }

      .portal-card {
        height: 115px;
        border-radius: 13px;
      }

      .portal-card-content {
        padding: 12px 16px;
      }

      .portal-card-content h2 {
        font-size: 18px;
      }

      .portal-card-content p {
        font-size: 10px;
      }

      .portal-arrow {
        position: absolute;
        right: 15px;
        bottom: 18px;
        margin: 0;
        width: 27px;
        height: 27px;
      }

      .footer-text {
        bottom: 8px;
        font-size: 9px;
      }
    }

    @media (max-height: 600px) and (min-width: 521px) {
      .heading {
        margin-bottom: 20px;
      }

      .portal-card {
        height: 170px;
      }
    }
  </style>
</head>

<body>

  <main class="home-container">

    <div class="heading">
      <h1>Where Is My Bus?</h1>
      <p>Track your bus. Stay updated. Travel smarter.</p>
      <div class="heading-line"></div>
    </div>

    <div class="portal-grid">

      <!-- STUDENT PORTAL -->
      <a href="student.html" class="portal-card">
        <img src="images/student.jpg" alt="Student Portal">
        <div class="portal-card-content">
          <h2>Student Portal</h2>
          <p>Find your bus and track your route</p>
          <span class="portal-arrow">→</span>
        </div>
      </a>

      <!-- DRIVER PORTAL -->
      <a href="driver.html" class="portal-card">
        <img src="images/driver.jpg" alt="Driver Portal">
        <div class="portal-card-content">
          <h2>Driver Portal</h2>
          <p>Manage your route and pickups</p>
          <span class="portal-arrow">→</span>
        </div>
      </a>

      
      <a href="management.html" class="portal-card">
        <img src="images/management.jpg" alt="Management Portal">
        <div class="portal-card-content">
          <h2>Management Portal</h2>
          <p>Manage buses, routes and updates</p>
          <span class="portal-arrow">→</span>
        </div>
      </a>

    </div>

   
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>

</body>
</html>
